<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <!-- React, ReactDOM and Babel -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f6f9; }
        .layout { display: flex; gap: 20px; align-items: flex-start; }
        .products { flex: 3; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .product { background: white; padding: 10px; border-radius: 8px; text-align: center;
                   box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product img { height: 100px; object-fit: contain; }
        .product h4 { font-size: 14px; height: 50px; overflow: hidden; }
        .cart { flex: 2; background: white; padding: 15px; border-radius: 8px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 20px; }
        .cart-item { border-bottom: 1px solid #ddd; padding: 8px 0; }
        button { cursor: pointer; padding: 4px 10px; margin: 2px; }
        .error { color: #c0392b; }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function ShoppingCart() {
            const [products, setProducts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [cart, setCart] = useState([]);

            // Fetch products from REST API
            useEffect(() => {
                fetch("https://fakestoreapi.com/products")
                    .then(response => {
                        if (!response.ok) {
                            throw new Error("Failed to fetch products (status " + response.status + ")");
                        }
                        return response.json();
                    })
                    .then(data => {
                        setProducts(data);
                        setLoading(false);
                    })
                    .catch(err => {
                        setError(err.message);
                        setLoading(false);
                    });
            }, []);

            // Add item to cart (or increase quantity if already present)
            function addToCart(product) {
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    increaseQty(product.id);
                } else {
                    setCart([...cart, { ...product, quantity: 1 }]);
                }
            }

            function increaseQty(id) {
                setCart(cart.map(item =>
                    item.id === id ? { ...item, quantity: item.quantity + 1 } : item
                ));
            }

            // Decrease quantity; remove item when quantity reaches 0
            function decreaseQty(id) {
                setCart(cart
                    .map(item => item.id === id ? { ...item, quantity: item.quantity - 1 } : item)
                    .filter(item => item.quantity > 0)
                );
            }

            function removeItem(id) {
                setCart(cart.filter(item => item.id !== id));
            }

            const totalPrice = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

            if (loading) return <h2>Loading products...</h2>;
            if (error) return <h2 className="error">Error: {error}</h2>;

            return (
                <div>
                    <h1>🛒 Shopping Cart</h1>
                    <div className="layout">

                        {/* Product List */}
                        <div className="products">
                            {products.map(product => (
                                <div className="product" key={product.id}>
                                    <img src={product.image} alt={product.title} />
                                    <h4>{product.title}</h4>
                                    <p><strong>${product.price.toFixed(2)}</strong></p>
                                    <button onClick={() => addToCart(product)}>Add to Cart</button>
                                </div>
                            ))}
                        </div>

                        {/* Cart */}
                        <div className="cart">
                            <h2>Your Cart</h2>
                            {cart.length === 0 ? (
                                <p>Cart is empty.</p>
                            ) : (
                                cart.map(item => (
                                    <div className="cart-item" key={item.id}>
                                        <p>{item.title}</p>
                                        <p>
                                            ${item.price.toFixed(2)} x {item.quantity} =
                                            <strong> ${(item.price * item.quantity).toFixed(2)}</strong>
                                        </p>
                                        <button onClick={() => decreaseQty(item.id)}>-</button>
                                        <span> {item.quantity} </span>
                                        <button onClick={() => increaseQty(item.id)}>+</button>
                                        <button onClick={() => removeItem(item.id)}>Remove</button>
                                    </div>
                                ))
                            )}
                            <h3>Total: ${totalPrice.toFixed(2)}</h3>
                        </div>

                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<ShoppingCart />);
    </script>
</body>
</html>
