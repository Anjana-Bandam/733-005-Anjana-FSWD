<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Boundary Example</title>

    <!-- React, ReactDOM and Babel -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f6f9; }
        .box { background: white; padding: 20px; border-radius: 8px; width: 400px;
               box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .fallback { border: 2px solid #c0392b; background: #fdecea; }
        button { padding: 8px 16px; margin-top: 10px; cursor: pointer; }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        // Error Boundary class component
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }

            // Update state so the next render shows the fallback UI
            static getDerivedStateFromError(error) {
                return { hasError: true, error: error };
            }

            // Log the error details to the console
            componentDidCatch(error, errorInfo) {
                console.log("Error caught by ErrorBoundary:", error);
                console.log("Error message:", error.message);
                console.log("Component stack:", errorInfo.componentStack);
            }

            // Reset the error state
            handleTryAgain = () => {
                this.setState({ hasError: false, error: null });
            };

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="box fallback">
                            <h2>Something went wrong!</h2>
                            <p><strong>Error:</strong> {this.state.error.message}</p>
                            <button onClick={this.handleTryAgain}>Try Again</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // Child component that throws an error on button click
        function BuggyCounter() {
            const [count, setCount] = React.useState(0);
            const [crash, setCrash] = React.useState(false);

            // Throwing during render lets the Error Boundary catch it
            if (crash) {
                throw new Error("BuggyCounter crashed on button click!");
            }

            return (
                <div className="box">
                    <h2>Counter: {count}</h2>
                    <button onClick={() => setCount(count + 1)}>Increment</button>{" "}
                    <button onClick={() => setCrash(true)}>Throw Error</button>
                </div>
            );
        }

        function App() {
            return (
                <div>
                    <h1>React Error Boundary Demo</h1>
                    <ErrorBoundary>
                        <BuggyCounter />
                    </ErrorBoundary>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
