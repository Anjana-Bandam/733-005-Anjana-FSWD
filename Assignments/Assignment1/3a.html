<!DOCTYPE html>
<html>
<head>
    <title>Armstrong Number</title>
</head>

<body>

    <h2>Armstrong Number Check</h2>

    <script>
        let num = parseInt(prompt("Enter a number:"));

        let original = num;
        let sum = 0;

        while (num > 0) {
            let digit = num % 10;
            sum = sum + (digit * digit * digit);
            num = Math.floor(num / 10);
        }

        if (sum == original) {
            document.write("<h3>" + original + " is an Armstrong number.</h3>");
        }
        else {
            document.write("<h3>" + original + " is not an Armstrong number.</h3>");
        }
    </script>

</body>
</html>
