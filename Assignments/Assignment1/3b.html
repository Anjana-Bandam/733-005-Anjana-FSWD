<!DOCTYPE html>
<html>
<head>
    <title>Prime or Composite</title>
</head>

<body>

    <h2>Prime or Composite Number</h2>

    <script>
        let num = parseInt(prompt("Enter a number:"));

        let count = 0;

        // Check whether the given number is prime
        for (let i = 1; i <= num; i++) {
            if (num % i == 0) {
                count++;
            }
        }

        if (num <= 1) {
            document.write("<h3>" + num + " is neither Prime nor Composite.</h3>");
        }
        else if (count == 2) {

            document.write("<h3>" + num + " is a Prime number.</h3>");

            document.write("<h3>Prime numbers up to " + num + " are:</h3>");

            // Find prime numbers up to the given number
            for (let n = 2; n <= num; n++) {

                let factors = 0;

                for (let i = 1; i <= n; i++) {
                    if (n % i == 0) {
                        factors++;
                    }
                }

                if (factors == 2) {
                    document.write(n + " ");
                }
            }
        }
        else {
            document.write("<h3>" + num + " is a Composite number.</h3>");
        }
    </script>

</body>
</html>
