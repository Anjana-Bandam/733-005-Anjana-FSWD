<!doctype html>
<html>
  <head>
    <title>Open Elective Course Selection</title>
  </head>
  <body>
    <h2>Open Elective Course Selection</h2>

    <form>
      <label for="name">Student Name:</label>
      <input type="text" id="name" name="name" />
      <br /><br />

      <label for="roll">Roll Number:</label>
      <input type="text" id="roll" name="roll" />
      <br /><br />

      <label for="branch">Branch:</label>
      <select id="branch" name="branch">
        <option>CSE</option>
        <option>ECE</option>
        <option>EEE</option>
        <option>ME</option>
        <option>Civil</option>
      </select>
      <br /><br />

      <label>Choose Open Elective:</label>
      <br />
      <input type="radio" name="elective" value="ai" /> Artificial Intelligence
      <br />
      <input type="radio" name="elective" value="cloud" /> Cloud Computing
      <br />
      <input type="radio" name="elective" value="cyber" /> Cyber Security
      <br />
      <input type="radio" name="elective" value="iot" /> Internet of Things
      <br /><br />

      <label for="semester">Semester:</label>
      <select id="semester" name="semester">
        <option>III</option>
        <option>IV</option>
        <option>V</option>
        <option>VI</option>
      </select>
      <br /><br />

      <input type="submit" value="Submit" />
      <input type="reset" value="Reset" />
    </form>
  </body>
</html>
