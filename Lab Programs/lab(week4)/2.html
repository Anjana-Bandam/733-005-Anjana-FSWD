<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validate username</title>
</head>
<body>
    <script>
        let username=prompt("enter your username:")
        let pattern=/^\d[A-Za-z]{8}[A-Za-z]$/
        if (pattern.test(username)){
            document.write("Username is valid")
        }
        else{
            document.write("Username is invalid")
        }
    </script>
</body>
</html>
