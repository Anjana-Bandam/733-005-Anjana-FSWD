<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find second smallest and second largest</title>
</head>
<body>
    <script>
        let n=[3,1,5,7,8]
       document.write(n+"<br>")
       
        function secondLargest(arr){
            let max=arr[0];
           
            for(let i=1;i<arr.length;i++){
                if(arr[i]>max) max=arr[i]
            }
            let second=arr[0]
            for(let i=1;i<arr.length;i++){
                if(arr[i]<max && arr[i]>second) second=arr[i]
            }
            document.write(`Second largest: ${second}`)
        }
        function secondSmallest(arr){
            let max=arr[0];
           
            for(let i=1;i<arr.length;i++){
                if(arr[i]<max) max=arr[i]
            }
            let second=arr[0]
            for(let i=1;i<arr.length;i++){
                if(arr[i]>max && arr[i]<second) second=arr[i]
            }
            document.write(`Second smallest: ${second}`)
        }
         secondLargest(n)
         document.write("<br>")
        secondSmallest(n)
    </script>
</body>
</html>
