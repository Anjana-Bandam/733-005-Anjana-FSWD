<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequency of each character in a word</title>
</head>
<body>
    <script>
        let word=prompt("enter a word").toLowerCase()
        let freq=new Array(26).fill(0)

        for(let i=0;i<word.length;i++){
            let index=word[i].charCodeAt(0)-'a'.charCodeAt(0)
            freq[index]++;
        }
        for(let i=0;i<26;i++){
            if(freq[i]>0){
                document.write(`${String.fromCharCode(i+97)}: ${freq[i]}<br>`)
            }
        }
    </script>
</body>
</html>
