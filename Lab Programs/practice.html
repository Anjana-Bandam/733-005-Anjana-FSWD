<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let students = [
            { name: 'A', marks: 35 },
            { name: 'B', marks: 78 },
            { name: 'C', marks: 42 },
            { name: 'D', marks: 90 }
        ];

        let marks=students.map(s=>s.marks)
        let avg=marks.reduce((sum,n)=>sum+n,0)/marks.length
        let pass=students.filter(s=>s.marks>=40).map(s=>s.name)
        document.write(avg)
        document.write(pass)
    </script>
</body>
</html>
