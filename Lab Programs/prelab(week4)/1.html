<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Series</title>
</head>
<body>
    <script>
        let first=0;
        let second=1;
        let n=10;
        document.write("Fionacci Series:  0\n")
        for(let i=1;i<=n;i++){
            let third=first+second
            document.write(third +"  ")
           
            first=second
            second=third
        }
    </script>
</body>
</html>
