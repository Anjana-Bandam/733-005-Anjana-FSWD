<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookies enabled or not</title>
</head>
<body>
    <script>
        if ( navigator.cookieEnabled){
            document.write("Cookies are enabled")
        }
        else{
            document.write("Cookies are not enabled")
        }
    </script>
</body>
</html>
