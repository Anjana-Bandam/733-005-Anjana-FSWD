<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square and Cube</title>
</head>
<body>
    <script>
        let n = 5;
        const squareCube = (num) => {
            return { square: num * num, cube: num * num * num };
        };
        let result = squareCube(n);
        document.write(`Number: ${n}<br>`);
        document.write(`Square: ${result.square}<br>`);
        document.write(`Cube: ${result.cube}`);
    </script>
</body>
</html>
