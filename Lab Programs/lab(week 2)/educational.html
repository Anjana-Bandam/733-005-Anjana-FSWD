
<!DOCTYPE html>
<html>
<head>
    <title>Educational Qualifications</title>
</head>
<body>

    <h2>Educational Qualifications</h2>

    <form action="#" method="post">

        <label>10th Class:</label>
        <input type="text" name="tenth">
        <br><br>

        <label>10th Percentage:</label>
        <input type="number" name="tenth_percentage">
        <br><br>

        <label>12th / Diploma:</label>
        <input type="text" name="twelfth">
        <br><br>

        <label>12th / Diploma Percentage:</label>
        <input type="number" name="twelfth_percentage">
        <br><br>

        <label>Graduation:</label>
        <input type="text" name="graduation">
        <br><br>

        <label>Branch:</label>
        <input type="text" name="branch">
        <br><br>

        <label>CGPA:</label>
        <input type="number" step="0.01" name="cgpa">
        <br><br>

        <label>Year of Passing:</label>
        <input type="number" name="year">
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

    <br>

</html>
